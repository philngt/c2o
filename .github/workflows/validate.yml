name: C2O structural validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (Node 24)
        with:
          persist-credentials: false
      - name: Show interpreter
        run: python3 --version
      - name: Validate structure and scenario definitions
        run: python3 scripts/validate_c2o.py
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Check optional product-design template catalog
        run: python3 skills/c2o-work/assets/product-design/tools/template_check.py --root skills/c2o-work/assets/product-design
      - name: Run optional product-design checker tests
        run: python3 -m unittest discover -s skills/c2o-work/assets/product-design/tests -v
      - name: Run Apple source generator tests
        run: python3 -m unittest discover -s skills/c2o-work/assets/product-design/starters/apple/tests -v
