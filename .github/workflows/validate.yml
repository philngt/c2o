name: C2O structural validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Show interpreter
        run: python3 --version
      - name: Validate structure and scenario definitions
        run: python3 scripts/validate_c2o.py
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
